language: java

os:
  - linux

before_install:
  - curl -fsSL -o /tmp/jdk8.tar.gz https://github.com/AdoptOpenJDK/openjdk8-binaries/releases/download/jdk8u232-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u232b09.tar.gz
  - mkdir -p /tmp/jdk8 && tar -xzf /tmp/jdk8.tar.gz -C /tmp/jdk8 --strip-components=1
  - export JAVA_HOME=/tmp/jdk8 && export PATH="$JAVA_HOME/bin:$PATH"
  - java -version

install: true

before_cache:
  - rm -f $HOME/.gradle/caches/modules-2/modules-2.lock
cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/

script: ./gradlew -I .travis/test-logging.gradle --refresh-dependencies --no-daemon --continue :spring-security-core:jar :spring-security-core:test :spring-security-crypto:test :spring-security-web:test :spring-security-oauth2-client:test :spring-security-saml2-service-provider:test

after_script:
  - sh .travis/wait-for-log.sh
